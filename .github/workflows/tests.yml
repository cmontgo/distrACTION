name: tests

on:
  push:
    branches: [master, 'release/**']
  pull_request:
  workflow_dispatch:

jobs:
  testthat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # jmvcore is not on CRAN, so the package cannot be installed here. The
      # suite is built to run against R/ directly for exactly this reason:
      # test-analysis-smoke.R skips itself and the other five files still run.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::ggplot2
            any::R6

      - name: Run the suite
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      # The generator recomputes every fixture value twice by independent
      # routes and exits non-zero if they disagree, so running it is the check.
      # Its output is NOT byte-compared: RDS compression is not stable across R
      # versions, so a diff would fail on an R bump rather than on a real change.
      - name: Re-derive the reference values by both routes
        run: Rscript tools/make-reference-fixture.R
