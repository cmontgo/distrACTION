---
name:  FDistribution
title: F-Distribution
jrs:   '1.1'

items:
    - name: Inputs
      title: Input values
      type: Table
      rows: 3
      columns:
        - name: ParametersColumn
          title: Parameters
          type: text
        - name: DistributionFunctionColumn
          title: "'Probability'"
          type: text
          visible: (DistributionFunction)
        - name: QuantileFunctionColumn
          title: "'Quantile'"
          type: text
          visible: (QuantileFunction)

    - name: Outputs
      title: "Results"
      type: Table
      rows: 1
      columns:
        - name: DistributionResultColumn
          title: Probability
          type: number
          format: zto
          visible: (DistributionFunction)
        - name: QuantileResultColumn
          title: Quantile
          type: number
          visible: (QuantileFunction)
        - name: MeanColumn
          title: Mean
          type: number
          superTitle: Distribution Statistics
        - name: SDColumn
          title: SD
          type: number
          superTitle: Distribution Statistics

    - name: plot
      title: ""
      type:  Image
      width:  500
      height: 400
      renderFun: .plot
...
