---
name:  Chi2Distribution
title: χ2-Distribution
jrs:   '1.1'

items:
    - name: Inputs
      title: Input values
      type: Table
      rows: 2
      columns:
        - name: ParametersColumn
          title: Parameters
          type: text
        - name: DistributionFunctionColumn
          title: "'Compute probability'"
          type: text
          visible: (DistributionFunction)
        - name: QuantileFunctionColumn
          title: "'Compute quantile'"
          type: text
          visible: (QuantileFunction)

    - name: Outputs
      title: "Results"
      type: Table
      rows: 1
      clearWith:
        - group
        - alt
        - varEq
      columns:
        - name: DistributionResultColumn
          title: Probability
          type: number
          format: zto
          visible: (DistributionFunction)
        - name: QuantileResultColumn
          title: Quantile
          type: number
          visible: (QuantileFunction)
        - name: MeanColumn
          title: Mean
          type: text
          superTitle: Distribution Statistics
        - name: SDColumn
          title: SD
          type: text
          superTitle: Distribution Statistics

    - name: plot
      title: ""
      type:  Image
      width:  500
      height: 400
      renderFun: .plot
...
